services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vehicle_rental
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vehicle_rental"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Runs migrations to completion, then exits. The API waits on this rather
  # than racing an unmigrated schema on startup.
  migrate:
    build: .
    command: ["vrc", "db", "upgrade"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/vehicle_rental
    restart: "no"

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/vehicle_rental
      ENVIRONMENT: local
      DEBUG: "false"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"

volumes:
  postgres_data:
