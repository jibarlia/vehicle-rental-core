[project]
name = "vehicle-rental-core"
version = "0.1.0"
description = "Production-ready vehicle rental management service built with Python and FastAPI."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"

dependencies = [
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.38.0",
    "typer>=0.20.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
    "sqlalchemy[asyncio]>=2.0.44",
    "alembic>=1.17.0",
    "psycopg[binary,pool]>=3.2.12",
    "prometheus-client>=0.24.0",
]

[project.scripts]
vrc = "vehicle_rental_core.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "httpx>=0.28.1",
    "ruff>=0.14.0",
    "mypy>=1.18.0",
    "pre-commit>=4.4.0",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vehicle_rental_core"
module-root = "src"

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "N"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
strict = true
plugins = []
# Alembic's generated migration scripts are templated, not hand-typed code.
exclude = ["^migrations/versions/"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --cov=vehicle_rental_core --cov-report=term-missing"

[tool.coverage.run]
source = ["src/vehicle_rental_core"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
