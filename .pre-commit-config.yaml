repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.9
    hooks:
      # Fails if pyproject.toml changed without uv.lock being regenerated.
      - id: uv-lock

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # Run through uv so the hook type-checks against the locked
        # environment, not pre-commit's isolated virtualenv.
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
